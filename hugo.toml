baseURL = "https://markjin-lab.github.io/"
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false
hasCJKLanguage = true
# 生成 /robots.txt（模板见 layouts/robots.txt）
enableRobotsTXT = true
title = "markjin"
[outputs]
home = ["HTML","RSS"]
section = ["HTML","RSS"]

[params]
# 导语固定开头清单：只用于认出首页和列表里「只剩开头套话」的摘要（page-description.html：摘要以清单中某项起头、比较时不分大小写也不看末尾冒号，且其后不含字母或数字，就不显示摘要行）；开头不会从摘要里去掉；meta description 和正文不受影响；导语换新的固定开头时在这里加一项。
summary_strip_prefixes = ["今天最值得知道的是：", "The thing most worth knowing today:", "The main story today is"]

# 文件命名：<name>.md = 中文（默认，URL 不变，位于 /）；<name>.en.md = 英文（位于 /en/）。见 docs/i18n.md。
[languages.zh]
weight = 1
languageCode = "zh-cn"
languageName = "中文"
title = "markjin"
[[languages.zh.menus.main]]
name = "每日信号"
url = "/posts/daily/"
weight = 1
[[languages.zh.menus.main]]
name = "经济学习"
url = "/learn/"
weight = 2
[[languages.zh.menus.main]]
name = "专题"
url = "/topics/"
weight = 3
[[languages.zh.menus.main]]
name = "关于"
url = "/about/"
weight = 4

[languages.en]
weight = 2
languageCode = "en"
languageName = "English"
title = "markjin"
[[languages.en.menus.main]]
name = "Daily signals"
url = "/en/posts/daily/"
weight = 1
[[languages.en.menus.main]]
name = "Economic learning"
url = "/en/learn/"
weight = 2
[[languages.en.menus.main]]
name = "Topics"
url = "/en/topics/"
weight = 3
[[languages.en.menus.main]]
name = "About"
url = "/en/about/"
weight = 4