baseURL = "https://markjin-lab.github.io/"
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false
hasCJKLanguage = true
# 生成 /robots.txt（模板见 layouts/robots.txt）
enableRobotsTXT = true
title = "markjin"
[outputs]
home = ["HTML","RSS"]
section = ["HTML","RSS"]

[params]
# 导语固定开头清单：只用来认出「摘要只剩这句开头」的情形（page-description.html 列表摘要的第 5 条）：自动摘要或回退的 meta 以这里的某一项起头（不分大小写，不看末尾冒号）、其后不含任何字母时，首页和列表不显示摘要行。摘要本身不去掉开头，导语原句照原样显示（#109）；meta description 和正文不受影响。摘要的其余规则见 page-description.html 末尾的注释；导语换新的固定开头时在这里加一项。
summary_strip_prefixes = ["今天最值得知道的是：", "The thing most worth knowing today:", "The main story today is"]

# 文件命名：<name>.md = 中文（默认，URL 不变，位于 /）；<name>.en.md = 英文（位于 /en/）。见 docs/i18n.md。
[languages.zh]
weight = 1
languageCode = "zh-cn"
languageName = "中文"
title = "markjin"
[[languages.zh.menus.main]]
name = "每日信号"
url = "/posts/daily/"
weight = 1
[[languages.zh.menus.main]]
name = "专题"
url = "/topics/"
weight = 2
[[languages.zh.menus.main]]
name = "关于"
url = "/about/"
weight = 3

[languages.en]
weight = 2
languageCode = "en"
languageName = "English"
title = "markjin"
[[languages.en.menus.main]]
name = "Daily signals"
url = "/en/posts/daily/"
weight = 1
[[languages.en.menus.main]]
name = "Topics"
url = "/en/topics/"
weight = 2
[[languages.en.menus.main]]
name = "About"
url = "/en/about/"
weight = 3
