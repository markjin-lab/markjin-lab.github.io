baseURL = "https://markjin-lab.github.io/"
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false
hasCJKLanguage = true
# 生成 /robots.txt（模板见 layouts/robots.txt）
enableRobotsTXT = true
title = "markjin"
[outputs]
home = ["HTML","RSS"]
section = ["HTML","RSS"]

[params]
# 导语固定开头清单：只影响首页和列表的摘要行（layouts/partials/page-description.html 的 strip 参数），meta description 和正文不受影响；每项匹配不分大小写，末尾的冒号全角半角都认，冒号后的空白一并去掉；不带冒号的项后面必须跟空白，或者正好在文末；去掉后为空、只剩出处编号或是以 that 开头的半句时，列表回退显示本页 meta 描述；导语换新的固定开头时在这里加一项。
summary_strip_prefixes = ["今天最值得知道的是：", "The thing most worth knowing today:", "The main story today is"]

# 文件命名：<name>.md = 中文（默认，URL 不变，位于 /）；<name>.en.md = 英文（位于 /en/）。见 docs/i18n.md。
[languages.zh]
weight = 1
languageCode = "zh-cn"
languageName = "中文"
title = "markjin"
[[languages.zh.menus.main]]
name = "每日信号"
url = "/posts/daily/"
weight = 1
[[languages.zh.menus.main]]
name = "专题"
url = "/topics/"
weight = 2
[[languages.zh.menus.main]]
name = "关于"
url = "/about/"
weight = 3

[languages.en]
weight = 2
languageCode = "en"
languageName = "English"
title = "markjin"
[[languages.en.menus.main]]
name = "Daily signals"
url = "/en/posts/daily/"
weight = 1
[[languages.en.menus.main]]
name = "Topics"
url = "/en/topics/"
weight = 2
[[languages.en.menus.main]]
name = "About"
url = "/en/about/"
weight = 3
