name: Post-deploy smoke check
on:
  workflow_run:
    workflows: ["Deploy Hugo site to Pages"]
    types: [completed]
  schedule:
    - cron: '15 23 * * *'   # daily 07:15 SGT patrol, independent of deploys (catches a missed daily)
  workflow_dispatch:
permissions: {contents: read}
jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # Unit tests build the site with Hugo; GitHub sets CI=true, so they fail (not skip) without it.
      # Same install as pr-tests.yml (version pinned, deb verified by sha256).
      - name: Install Hugo (extended, same method as pr-tests.yml)
        env: {HUGO_VERSION: 0.139.4}   # keep in sync with hugo.yml and pr-tests.yml
        run: |
          wget -qO /tmp/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          # sha256 of hugo_extended_0.139.4_linux-amd64.deb, from the official v0.139.4 release:
          # https://github.com/gohugoio/hugo/releases/download/v0.139.4/hugo_0.139.4_checksums.txt
          # Update together with HUGO_VERSION.
          HUGO_DEB_SHA256=fcf8ec89fc3f2eba08218f5592f5a79f4f380572432f91d7bbc69f1d979034da
          echo "${HUGO_DEB_SHA256}  /tmp/hugo.deb" | sha256sum -c -
          sudo dpkg -i /tmp/hugo.deb
      - name: Verify Hugo is on PATH
        run: hugo version
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Wait for CDN to pick up the new deploy
        if: ${{ github.event_name == 'workflow_run' }}
        run: sleep 30
      - name: Smoke check live site
        run: python3 scripts/smoke_check.py --base https://markjin-lab.github.io/ --deploy-sha "${{ github.event.workflow_run.head_sha }}" --json-out smoke-report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: smoke-report, path: smoke-report.json}
