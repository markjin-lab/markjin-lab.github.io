name: PR unit tests (with Hugo)
# Runs the Python unit tests against a real Hugo binary on every PR to main.
# Job id/name "unittest-hugo" is meant to be stable so it can become a required check.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  unittest-hugo:
    name: unittest-hugo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUGO_VERSION: 0.139.4   # keep in sync with hugo.yml
      REQUIRE_HUGO: "1"       # tests must fail (not skip) if hugo is missing; CI=true is set by GitHub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install Hugo (extended, same method as hugo.yml)
        run: |
          wget -qO /tmp/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          # sha256 of hugo_extended_0.139.4_linux-amd64.deb, from the official v0.139.4 release:
          # https://github.com/gohugoio/hugo/releases/download/v0.139.4/hugo_0.139.4_checksums.txt
          # Update together with HUGO_VERSION.
          HUGO_DEB_SHA256=fcf8ec89fc3f2eba08218f5592f5a79f4f380572432f91d7bbc69f1d979034da
          echo "${HUGO_DEB_SHA256}  /tmp/hugo.deb" | sha256sum -c -
          sudo dpkg -i /tmp/hugo.deb
      - name: Verify Hugo is on PATH
        run: |
          hugo version
          hugo version | grep -F "v${HUGO_VERSION}" | grep -F "+extended"
      # Same as `python3 -m unittest discover -s tests -v`, plus a CI-only gate:
      # fail if no tests ran or if any test was skipped.
      - name: Unit tests
        run: |
          python3 - <<'PY'
          import sys
          import unittest
          suite = unittest.defaultTestLoader.discover("tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print(f"zero-skip gate: testsRun={result.testsRun}, skipped={len(result.skipped)}", file=sys.stderr)
          if not result.wasSuccessful() or result.testsRun == 0 or result.skipped:
              print(f"testsRun={result.testsRun}, skipped={len(result.skipped)}", file=sys.stderr)
              raise SystemExit(1)
          PY
