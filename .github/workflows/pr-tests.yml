name: PR unit tests (with Hugo)
# Runs the Python unit tests against a real Hugo binary on every PR to main.
# Job id/name "unittest-hugo" is meant to be stable so it can become a required check.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  unittest-hugo:
    name: unittest-hugo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUGO_VERSION: 0.139.4   # keep in sync with hugo.yml
      REQUIRE_HUGO: "1"       # tests must fail (not skip) if hugo is missing; CI=true is set by GitHub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install Hugo (extended, same method as hugo.yml)
        run: |
          wget -qO /tmp/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i /tmp/hugo.deb
      - name: Verify Hugo is on PATH
        run: |
          hugo version
          hugo version | grep -F "v${HUGO_VERSION}" | grep -F "+extended"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
